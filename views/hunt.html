<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VampVS · Caça</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="pagina">
    <header class="topo">
      <h1>Caça</h1>
      <nav class="nav" id="nav" aria-label="Principal"></nav>
    </header>

    <div class="grade grade-larga">
      <div class="coluna">
        <section class="painel" aria-labelledby="t-cacar">
          <h2 id="t-cacar">Sair para caçar</h2>
          <div class="resumo-pa">
            <div>Pontos de ação: <strong id="pa"></strong></div>
            <button class="btn btn-grande" id="btn-cacar" type="button">Caçar</button>
          </div>
          <p class="fraco" id="dica"></p>
        </section>

        <section class="painel" aria-labelledby="t-resultado">
          <h2 id="t-resultado">Resultado da caçada</h2>
          <div id="resultado"><p class="vazio">Você ainda não caçou nesta sessão.</p></div>
        </section>
      </div>

      <section class="painel" aria-labelledby="t-monstros">
        <h2 id="t-monstros">Monstros da região</h2>
        <p class="fraco">Cada caçada sorteia um destes monstros. Os mais fortes só aparecem quando você tem nível suficiente.</p>
        <div id="monstros"></div>
      </section>
    </div>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/static/js/common.js"></script>
  <script src="/static/js/hunt.js"></script>
</body>
</html>
