<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VampVS · Escolha seu avatar</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="pagina pagina-estreita">
    <header class="topo">
      <h1>Escolha seu avatar</h1>
      <a class="link-discreto oculto" id="link-voltar" href="/profile">Voltar ao perfil</a>
    </header>

    <section class="painel" aria-labelledby="t-avatar">
      <h2 id="t-avatar">Quem é você na guerra?</h2>
      <p class="fraco" id="subtitulo">Carregando as opções...</p>

      <div class="avatar-grade" id="grade" role="radiogroup" aria-labelledby="t-avatar"></div>

      <div class="avatar-acoes">
        <span class="fraco" id="selecionado-nome"></span>
        <button class="btn" id="btn-salvar" type="button" disabled>Salvar Avatar</button>
      </div>
    </section>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/static/js/common.js"></script>
  <script src="/static/js/avatar.js"></script>
</body>
</html>
