<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VampVS · Vila</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="pagina">
    <header class="topo">
      <h1>Vila</h1>
      <nav class="nav" id="nav" aria-label="Principal"></nav>
    </header>

    <section class="painel">
      <div class="resumo-vila">
        <div>Ouro: <strong id="ouro"></strong></div>
        <div>Nível: <strong id="nivel"></strong></div>
        <div>Mochila: <strong id="mochila"></strong></div>
        <button class="btn btn-ghost" id="btn-ouro-dev" type="button" hidden>+500 ouro (teste)</button>
      </div>

      <div class="abas" role="tablist" aria-label="Seções da Vila">
        <button class="btn btn-ghost" id="aba-btn-mercado" role="tab" aria-selected="true" aria-controls="aba-mercado" type="button">Mercado</button>
        <button class="btn btn-ghost" id="aba-btn-inventario" role="tab" aria-selected="false" aria-controls="aba-inventario" type="button">Meu inventário</button>
      </div>

      <div id="aba-mercado" role="tabpanel" aria-labelledby="aba-btn-mercado">
        <p class="fraco">Itens exclusivos de outra facção não aparecem aqui. Preço e requisitos são conferidos pelo servidor na hora da compra.</p>
        <div class="mercado-grid" id="mercado"></div>
      </div>

      <div id="aba-inventario" role="tabpanel" aria-labelledby="aba-btn-inventario" class="oculto">
        <p class="fraco">Vender devolve metade do que você pagou. Itens iniciais não podem ser vendidos. Cada tipo de equipamento tem um só item equipado.</p>
        <div class="efeitos oculto" id="efeitos"></div>
        <div id="inventario"></div>
      </div>
    </section>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/static/js/common.js"></script>
  <script src="/static/js/village.js"></script>
</body>
</html>
